<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentZ Result Board</title>
<style>
/* AgentZ Result Board — iFinity slate/teal tokens, both themes.
   Design SSOT: agentz-dev-docs/concerns/result-board-mcp-apps.md (2026-07-27 UI spec artifact).
   Self-contained: system font stack, no external requests, validated chart palette.
   Brand assets (wordmark rasters, Z mark, AgentZ Sans) are baked in as data URIs. */
:root {
  color-scheme: light;
  --surface: var(--color-background-primary, #FCFDFD);
  --surface-2: var(--color-background-secondary, #F2F5F6);
  --ink: var(--color-text-primary, #1E2F38);
  --ink-2: var(--color-text-secondary, #44545E);
  --muted: var(--color-text-tertiary, #5D6B74); --faint: #8A97A0;
  --line: var(--color-border-primary, #D7DDE1);
  --line-soft: var(--color-border-secondary, #E4E9EC);
  --accent: var(--color-text-info, #156082); --accent-soft: var(--color-background-info, #E3F0F5); --link: var(--color-text-info, #156082);
  --good: #0CA30C; --good-text: var(--color-text-success, #0A6E0A); --good-soft: var(--color-background-success, #E8F6E8);
  --warn: #E8A20D; --warn-text: var(--color-text-warning, #7A5600); --warn-soft: var(--color-background-warning, #FBF1DA);
  --crit: #D03B3B; --crit-text: var(--color-text-danger, #A32626); --crit-soft: var(--color-background-danger, #FAE8E8);
  --s1: #0C6C9E; --s2: #D8622A; --s3: #2FA9C5; --s4: #B08514;
  --chart-grid: #E3E8EB; --chart-axis: #C7D0D5; --focus: #2FA9C5;
  --shadow-board: 0 1px 2px rgba(30,47,56,.06), 0 6px 20px rgba(30,47,56,.07), 0 0 0 1px rgba(30,47,56,.05);
  --font-ui: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
  --azb-font-mono: var(--font-mono, ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace);
  --azb-safe-top: 0px; --azb-safe-right: 0px; --azb-safe-bottom: 0px; --azb-safe-left: 0px;
  /* Companion titlebar capsule recipe, light theme (ifinity-companion styles.css). */
  --brand-line: #D7DDE1; --brand-bg: #F0F2F4; --brand-shadow: 0 1px 2px rgba(63,76,85,.06), 0 0 0 1px rgba(63,76,85,.06);
  --brand-ink: #2D404A; --brand-divider: #D7DDE1; --brand-name-glow: none; --brand-z-glow: none;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: var(--color-background-primary, #16232B); --surface-2: var(--color-background-secondary, #1C2B34);
    --ink: var(--color-text-primary, #E9EEF1); --ink-2: var(--color-text-secondary, #C2CDD4); --muted: var(--color-text-tertiary, #94A3AC); --faint: #6F7F89;
    --line: var(--color-border-primary, #2A3942); --line-soft: var(--color-border-secondary, #223039);
    --accent: var(--color-text-info, #57C7DE); --accent-soft: var(--color-background-info, #14313C); --link: var(--color-text-info, #57C7DE);
    --good-text: var(--color-text-success, #5ECC5E); --good-soft: var(--color-background-success, #12300F);
    --warn-text: var(--color-text-warning, #F0C05A); --warn-soft: var(--color-background-warning, #33270B);
    --crit-text: var(--color-text-danger, #EC8080); --crit-soft: var(--color-background-danger, #3A1414);
    --s1: #4098C8; --s2: #DC6A34; --s3: #279BB5; --s4: #B08514;
    --chart-grid: #24333C; --chart-axis: #33434D; --focus: #57C7DE;
    --shadow-board: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.06);
    --brand-line: rgba(255,255,255,.08); --brand-bg: rgba(255,255,255,.045); --brand-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 18px rgba(0,0,0,.12);
    --brand-ink: rgba(255,255,255,.85); --brand-divider: rgba(87,199,222,.22); --brand-name-glow: 0 0 14px rgba(87,199,222,.14), 0 1px 8px rgba(255,255,255,.06); --brand-z-glow: drop-shadow(0 0 6px rgba(87,199,222,.28));
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: var(--color-background-primary, #16232B); --surface-2: var(--color-background-secondary, #1C2B34);
  --ink: var(--color-text-primary, #E9EEF1); --ink-2: var(--color-text-secondary, #C2CDD4); --muted: var(--color-text-tertiary, #94A3AC); --faint: #6F7F89;
  --line: var(--color-border-primary, #2A3942); --line-soft: var(--color-border-secondary, #223039);
  --accent: var(--color-text-info, #57C7DE); --accent-soft: var(--color-background-info, #14313C); --link: var(--color-text-info, #57C7DE);
  --good-text: var(--color-text-success, #5ECC5E); --good-soft: var(--color-background-success, #12300F);
  --warn-text: var(--color-text-warning, #F0C05A); --warn-soft: var(--color-background-warning, #33270B);
  --crit-text: var(--color-text-danger, #EC8080); --crit-soft: var(--color-background-danger, #3A1414);
  --s1: #4098C8; --s2: #DC6A34; --s3: #279BB5; --s4: #B08514;
  --chart-grid: #24333C; --chart-axis: #33434D; --focus: #57C7DE;
  --shadow-board: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.06);
  --brand-line: rgba(255,255,255,.08); --brand-bg: rgba(255,255,255,.045); --brand-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 18px rgba(0,0,0,.12);
  --brand-ink: rgba(255,255,255,.85); --brand-divider: rgba(87,199,222,.22); --brand-name-glow: 0 0 14px rgba(87,199,222,.14), 0 1px 8px rgba(255,255,255,.06); --brand-z-glow: drop-shadow(0 0 6px rgba(87,199,222,.28));
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; max-width: 100%; overflow-x: hidden; }
button { min-height: 44px; }
body {
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.55;
  padding: calc(2px + var(--azb-safe-top)) calc(2px + var(--azb-safe-right)) calc(2px + var(--azb-safe-bottom)) calc(2px + var(--azb-safe-left));
}
:is(button, [tabindex]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

.azb { width: 100%; max-width: 760px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-board); overflow: hidden; }
:root[data-display-mode="fullscreen"] body { min-height: 100vh; }
:root[data-display-mode="fullscreen"] .azb { max-width: none; min-height: calc(100vh - var(--azb-safe-top) - var(--azb-safe-bottom) - 4px); border-radius: 0; box-shadow: none; }
:root[data-fixed-height="true"] html, :root[data-fixed-height="true"] body { height: 100%; }
:root[data-fixed-height="true"] .azb { min-height: 100%; }
.azb-head { padding: 14px 18px 0; }
.azb-toprow { display: flex; align-items: center; gap: 10px; min-height: 26px; flex-wrap: wrap; }
/* Brand lockup — the companion titlebar capsule, ported: theme-paired iFINITY
   wordmark imagery, "Agent" set in AgentZ Sans, the Z staying imagery. */
.azb-brand { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; height: 26px; padding: 4px 9px 4px 8px; border: 1px solid var(--brand-line); border-radius: 999px; background: var(--brand-bg); box-shadow: var(--brand-shadow); }
.azb-wm { width: 84px; height: auto; max-height: 14px; display: block; opacity: .95; }
.azb-wm-dark { display: none; }
:root[data-theme="dark"] .azb-wm-light { display: none; }
:root[data-theme="dark"] .azb-wm-dark { display: block; }
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .azb-wm-light { display: none; }
  :root:where(:not([data-theme="light"])) .azb-wm-dark { display: block; }
}
.azb-brand-product { display: inline-flex; align-items: center; flex: 0 0 auto; height: 16px; padding-left: 5px; border-left: 1px solid var(--brand-divider); font: 400 15px/1 'AgentZ Sans', var(--font-ui); color: var(--brand-ink); letter-spacing: .015em; }
.azb-brand-name { text-shadow: var(--brand-name-glow); margin-right: -0.015em; }
.azb-brand-z { height: 12px; width: auto; display: block; filter: var(--brand-z-glow); }
/* Tool name and tier badges carry the brand face at companion spec: always
   weight 400 — AgentZ Sans has no bold to synthesize. The tool name uses the
   companion's uppercase eyebrow tracking; the wide geometric caps carry it. */
.azb-tool { font: 400 14px var(--font-ui); font-family: 'AgentZ Sans', var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); overflow-wrap: anywhere; }
.azb-spacer { flex: 1; }
.azb-badge { display: inline-flex; align-items: center; gap: 5px; font-family: 'AgentZ Sans', var(--font-ui); font-size: 11px; font-weight: 400; letter-spacing: .015em; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.azb-badge.neutral { color: var(--ink-2); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.azb-badge.good { color: var(--good-text); background: var(--good-soft); }
.azb-badge.warn { color: var(--warn-text); background: var(--warn-soft); }
.azb-badge.crit { color: var(--crit-text); background: var(--crit-soft); }
/* Mode/expand affordances are quiet text: the hover colour signals clickability;
   a frame would compete with the content cards. */
.azb-mode { font: 600 11px var(--font-ui); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 6px 10px; cursor: pointer; }
.azb-mode:hover { color: var(--accent); }
.azb-verdict { font-size: 18px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; margin: 10px 0 2px; overflow-wrap: anywhere; }
.azb-subverdict { font-size: 12.5px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.azb-toprow + .azb-subverdict { margin-top: 8px; }
.azb-facts { display: flex; flex-wrap: wrap; gap: 6px 36px; padding: 12px 18px 2px; }
.azb-fact .fv { font-size: 24px; font-weight: 700; line-height: 1.15; }
.azb-fact .fl { font-size: 11px; color: var(--muted); }
.azb-notice { display: flex; gap: 9px; margin: 12px 18px 0; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; }
.azb-notice.warn { background: var(--warn-soft); color: var(--warn-text); }
.azb-notice.crit { background: var(--crit-soft); color: var(--crit-text); }
.azb-notice.info { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-soft); }
.azb-sect { margin: 0 0 14px; }
.azb-sect:last-child { margin-bottom: 0; }
/* Section eyebrows carry the brand face at companion eyebrow spec (400, uppercase,
   wide tracking) — one typographic voice for chrome labels across the board. */
.azb-sect-title { font-family: 'AgentZ Sans', var(--font-ui); font-size: 10.5px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
.azb-diff { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0 0 12px; }
.azb-diff-row { display: grid; grid-template-columns: minmax(96px, 130px) 1fr 20px 1fr; gap: 10px; align-items: baseline; padding: 8px 14px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
.azb-diff-row:last-child { border-bottom: 0; }
.azb-diff-row.head { background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.azb-diff-row .df { font-size: 11.5px; color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
.azb-diff-row .arrow { color: var(--faint); text-align: center; }
.azb-diff-row .before { color: var(--muted); overflow-wrap: anywhere; }
.azb-diff-row .after { overflow-wrap: anywhere; }
.azb-diff-row .after.changed { font-weight: 600; }
.azb-diff-row .after.destructive { font-weight: 600; color: var(--crit-text); }
@media (max-width: 520px) {
  .azb-diff-row { grid-template-columns: 1fr; gap: 2px; }
  .azb-diff-row.head { display: none; }
  .azb-diff-row .arrow { display: none; }
  .azb-diff-row .before::before { content: "was: "; color: var(--faint); }
}
.azb-tabs { display: flex; gap: 2px; padding: 12px 12px 0; border-bottom: 1px solid var(--line-soft); overflow-x: auto; scrollbar-width: none; }
.azb-tabs::-webkit-scrollbar { display: none; }
.azb-tab { font: 600 12.5px var(--font-ui); color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px; cursor: pointer; white-space: nowrap; border-radius: 6px 6px 0 0; }
.azb-tab:hover { color: var(--ink); background: var(--surface-2); }
.azb-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.azb-panel { padding: 14px 18px; }
.azb-panel[hidden] { display: none; }
.azb-seg { display: inline-flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; margin: 0 0 10px; }
.azb-seg button { font: 600 11.5px var(--font-ui); color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.azb-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(30,47,56,.14); }
.azb-chart-wrap { min-width: 0; }
.azb-why { font-size: 11.5px; color: var(--faint); margin: 8px 0 0; }
.azb-bar-chart { display: grid; gap: 8px; }
.azb-bar-row { display: grid; grid-template-columns: minmax(68px, 120px) minmax(80px, 1fr) minmax(34px, max-content); gap: 9px; align-items: center; }
.azb-bar-label { min-width: 0; color: var(--ink-2); font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.azb-bar-track { position: relative; height: 18px; overflow: hidden; border-radius: 5px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-soft); }
.azb-bar-zero { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--chart-axis); }
.azb-bar-fill { position: absolute; top: 3px; bottom: 3px; min-width: 2px; border-radius: 3px; background: var(--s1); }
.azb-bar-value { color: var(--ink); font: 700 12px var(--azb-font-mono); text-align: right; }
.azb-line-chart { min-width: 0; }
.azb-line-plot { height: 150px; border-radius: 7px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-soft); overflow: hidden; }
.azb-line-plot svg { display: block; width: 100%; height: 100%; }
.azb-line-stroke { vector-effect: non-scaling-stroke; }
.azb-line-periods, .azb-line-values { display: flex; justify-content: space-between; gap: 12px; min-width: 0; }
.azb-line-periods { margin-top: 5px; color: var(--faint); font-size: 11.5px; }
.azb-line-values { margin-top: 3px; color: var(--ink-2); font-size: 12px; font-weight: 600; }
.azb-line-periods span, .azb-line-values span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grid-line { stroke: var(--chart-grid); stroke-width: 1; }
.axis-line { stroke: var(--chart-axis); stroke-width: 1; }
@media (max-width: 420px) {
  .azb-bar-row { grid-template-columns: minmax(58px, 86px) minmax(64px, 1fr) minmax(30px, max-content); gap: 7px; }
  .azb-line-plot { height: 128px; }
}
.azb-table-scroll { overflow: hidden; margin: 0; padding: 0; }
table.azb-table { border-collapse: collapse; table-layout: fixed; width: 100%; min-width: 0; font-size: 12.5px; }
table.azb-table th { text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
table.azb-table td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--line-soft); white-space: normal; overflow-wrap: anywhere; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
table.azb-table td[title] { cursor: default; }
table.azb-table .num { text-align: right; font-variant-numeric: tabular-nums; }
table.azb-table .id { font-family: var(--azb-font-mono); font-size: 11.5px; color: var(--ink-2); }
.azb-table-foot { display: flex; align-items: center; gap: 14px; margin: 10px 0 0; flex-wrap: wrap; }
.azb-more { font: 600 12px var(--font-ui); color: var(--accent); background: transparent; border: 0; padding: 8px 0; cursor: pointer; }
.azb-more:hover { text-decoration: underline; }
.azb-rowcount { font-size: 11.5px; color: var(--faint); }
.azb-kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 4px 18px; font-size: 12.5px; }
.azb-kv .k { color: var(--muted); font-weight: 600; }
.azb-kv .v { overflow-wrap: anywhere; }
.azb-report { display: grid; gap: 10px; }
.azb-report-body, .azb-report-details { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.azb-report-body { font-size: 14px; line-height: 1.65; }
.azb-report-details { color: var(--muted); border-top: 1px solid var(--line-soft); padding-top: 10px; }
.azb-design-group { margin-top: 14px; }
.azb-story { display: grid; gap: 16px; }
.azb-story-section + .azb-story-section { border-top: 1px solid var(--line-soft); padding-top: 14px; }
.azb-story-title { font-family: 'AgentZ Sans', var(--font-ui); font-size: 10.5px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
.azb-loading { padding: 12px 18px 2px; }
.azb-loading-label { font-size: 11.5px; color: var(--muted); margin: 0 0 8px; }
.azb-skeleton-line { height: 9px; width: 92%; border-radius: 999px; margin: 7px 0; background: linear-gradient(90deg, var(--surface-2), var(--line-soft), var(--surface-2)); background-size: 220% 100%; animation: azb-shimmer 1.3s ease-in-out infinite; }
.azb-skeleton-line.short { width: 58%; }
@keyframes azb-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.azb-confirm { border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; }
.azb-confirm .ct { font-size: 11px; color: var(--muted); margin: 0 0 4px; }
.azb-confirm .cv { font-family: var(--azb-font-mono); font-size: 11px; color: var(--ink-2); overflow-wrap: anywhere; user-select: all; }
.azb-verify { border: 1px solid var(--line); border-radius: 10px; padding: 4px 16px; margin: 0 0 12px; }
.azb-vrow { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
.azb-vrow:last-child { border-bottom: 0; }
.azb-vmark { width: 18px; height: 18px; border-radius: 50%; flex: 0 0 auto; margin-top: 1px; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--good-soft); color: var(--good-text); }
.azb-vmark.pending { background: var(--surface-2); color: var(--muted); }
.azb-vmark.failed { background: var(--crit-soft); color: var(--crit-text); }
.azb-vrow .vt { font-weight: 600; font-size: 12.5px; }
.azb-vrow .vd { font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.azb-proof-summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; flex-wrap: wrap; }
.azb-proof-title { font-weight: 600; font-size: 12.5px; }
.azb-proof-claim { margin: 8px 0; color: var(--ink); font-size: 13px; line-height: 1.45; }
.azb-proof-next { margin: 8px 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
.azb-proof-chips { display: flex; gap: 5px; flex-wrap: wrap; }
.azb-proof-chip { display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; padding: 3px 8px; background: var(--good-soft); color: var(--good-text); font-size: 10.5px; font-weight: 700; }
.azb-proof-chip.pending { background: var(--surface-2); color: var(--muted); }
.azb-proof-chip.failed { background: var(--crit-soft); color: var(--crit-text); }
.azb-evrow { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.azb-evrow:last-child { border-bottom: 0; }
.azb-evglyph { width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto; display: grid; place-items: center; font-size: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-soft); }
.azb-evbody { min-width: 0; flex: 1; }
.azb-evlabel { font-weight: 600; font-size: 12.5px; overflow-wrap: anywhere; }
.azb-evtype { font-size: 11px; color: var(--faint); }
.azb-evact { font: 600 11.5px var(--font-ui); color: var(--link); background: none; border: 0; cursor: pointer; padding: 8px 6px; white-space: nowrap; }
.azb-evact:hover { text-decoration: underline; }
.azb-log { margin: 12px 0 0; border-top: 1px dashed var(--line); padding-top: 8px; }
.azb-log-title { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); margin: 0 0 4px; }
.azb-log-line { font-family: var(--azb-font-mono); font-size: 11px; color: var(--muted); padding: 1px 0; overflow-wrap: anywhere; }

/* Client iPart project plan — the Site and Content Studio view for scaffold. */
.azb-iproj { display: grid; gap: 10px; min-width: 0; }
.azb-iproj-hero { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; background: var(--surface-2); padding: 11px 14px; min-width: 0; }
.azb-iproj-hero .iph-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.azb-iproj-hero .iph-name { font-size: 16px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.azb-iproj-hero .iph-model { margin: 6px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
.azb-iproj-versions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.azb-iproj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 8px; min-width: 0; }
.azb-iproj-card { border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); padding: 9px 11px; min-width: 0; overflow: hidden; }
.azb-iproj-card.wide { grid-column: 1 / -1; }
.azb-iproj-card .ipc-title { margin: 0 0 7px; font-family: 'AgentZ Sans', var(--font-ui); font-size: 10.5px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.azb-iproj-kv { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr); gap: 3px 8px; font-size: 11.5px; }
.azb-iproj-kv .k { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.azb-iproj-kv .v { color: var(--ink-2); overflow-wrap: anywhere; min-width: 0; }
.azb-iproj-kv .v.mono { font-family: var(--azb-font-mono); font-size: 10.5px; }
.azb-iproj-contracts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 6px; min-width: 0; }
.azb-iproj-contract { border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface-2); min-width: 0; overflow: hidden; }
.azb-iproj-contract > summary { cursor: pointer; list-style-position: inside; padding: 8px 10px; font-size: 11.5px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.azb-iproj-contract[open] > summary { border-bottom: 1px solid var(--line-soft); }
.azb-iproj-contract .ipd-body { padding: 8px 10px; min-width: 0; overflow: hidden; }
.azb-iproj-contract .ipd-empty { font-size: 11px; color: var(--faint); }
.azb-iproj-contract .ipd-code { margin: 0; max-height: 260px; overflow: auto; white-space: pre; font: 10.5px/1.5 var(--azb-font-mono); color: var(--ink-2); }
.azb-iproj-flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; min-width: 0; }
.azb-iproj-step { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; padding: 0 0 10px; min-width: 0; }
.azb-iproj-step:not(:last-child)::after { content: ''; position: absolute; left: 11px; top: 23px; bottom: 1px; width: 2px; background: var(--line); }
.azb-iproj-step .ips-mark { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 10.5px; font-weight: 700; }
.azb-iproj-step .ips-text { padding-top: 3px; font-size: 11.5px; line-height: 1.45; color: var(--ink-2); overflow-wrap: anywhere; }
.azb-iproj-command { margin: 7px 0 0; padding: 8px 10px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface-2); font: 10.5px/1.5 var(--azb-font-mono); color: var(--ink-2); overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
/* Surfacing affordances: nothing in a response is a dead end. */
.azb-mini-more { font: 600 11px var(--font-ui); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; margin-top: 6px; cursor: pointer; }
.azb-mini-more:hover { border-color: var(--accent); }
.azb-mini-more[hidden] { display: none; }
table.azb-mini tr.azb-mini-row { cursor: pointer; }
table.azb-mini tr.azb-mini-row:hover td { background: var(--surface-2); }
table.azb-mini tr.azb-mini-row.open td { background: var(--accent-soft); }
table.azb-mini tr.azb-mini-detail > td { background: var(--surface-2); border-left: 2px solid var(--accent); padding: 9px 12px; }
table.azb-mini tr.azb-mini-detail .ps-kv { grid-template-columns: minmax(0, 32%) minmax(0, 1fr); }
.azb-tl-entry.azb-tl-click { cursor: pointer; border-radius: 8px; }
.azb-tl-entry.azb-tl-click:hover { background: var(--surface-2); }
.azb-tl-entry .tl-detail { margin-top: 7px; background: var(--surface-2); border-left: 2px solid var(--accent); border-radius: 6px; padding: 8px 11px; }
.azb-code.azb-code-click { cursor: pointer; }
.azb-code.azb-code-click:hover { border-color: var(--accent); }
.azb-code .cd-detail { margin-top: 6px; border-top: 1px solid var(--line-soft); padding-top: 6px; }
/* Focus mechanic: the grid never reflows — focusing a section opens its full
 * data in a full-width panel below, the focused card carries the accent and
 * the rest step back. Motion is a soft fade/rise, honoring reduced-motion. */
.azb-prof-sec .ps-open { display: block; margin-top: 8px; font: 700 10.5px var(--font-ui); letter-spacing: .05em; text-transform: uppercase; color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; cursor: pointer; text-align: left; }
.azb-prof-sec .ps-open:hover { border-color: var(--accent); }
.azb-prof-sec .ps-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.azb-prof-grid.has-focus .azb-prof-sec { opacity: 0.55; transition: opacity 160ms ease; }
.azb-prof-grid.has-focus .azb-prof-sec.focused { opacity: 1; box-shadow: 0 0 0 2px var(--accent); }
.azb-prof-focus { margin-top: 10px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; background: var(--surface-2); padding: 11px 14px; min-width: 0; overflow: hidden; }
.azb-prof-focus.in { animation: azb-focus-in 180ms ease; }
@keyframes azb-focus-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .azb-prof-focus.in { animation: none; } .azb-prof-grid.has-focus .azb-prof-sec { transition: none; } }
.azb-prof-focus .pf-head { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; min-width: 0; }
.azb-prof-focus .pf-title { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink); }
.azb-prof-focus .pf-close { font: 600 11px var(--font-ui); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
.azb-prof-focus .pf-close:hover { color: var(--accent); border-color: var(--accent); }
/* Detail cards: populated-first pairs flowing into responsive columns. */
.azb-detail { min-width: 0; }
.azb-kv-flow { columns: 250px auto; column-gap: 22px; }
.azb-kv-flow .kv-pair { display: grid; grid-template-columns: minmax(0, 44%) minmax(0, 1fr); gap: 2px 8px; font-size: 11.5px; break-inside: avoid; padding: 2px 0; }
.azb-kv-flow .kv-pair .k { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.azb-kv-flow .kv-pair .v { color: var(--ink-2); overflow-wrap: anywhere; min-width: 0; }
.azb-kv-demoted { margin-top: 6px; opacity: 0.75; }
/* Nested values expand in place — never a {…} dead end. */
.azb-val-toggle { font: 600 10.5px var(--azb-font-mono); color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; cursor: pointer; }
.azb-val-toggle:hover { border-color: var(--accent); }
.azb-val-toggle.open { background: var(--accent-soft); }
.azb-val-block { margin: 5px 0 3px; border-left: 2px solid var(--line); padding-left: 9px; min-width: 0; overflow: hidden; }
.azb-prof-sec .ps-data > summary { cursor: pointer; user-select: none; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
.azb-prof-sec .ps-data[open] > summary { margin-bottom: 6px; }
.azb-prof-sec .ps-sub { margin: 7px 0 0; min-width: 0; overflow: hidden; }
.azb-prof-sec .ps-sub-title { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 4px; }
/* Markdown (model-authored report text) — escape-first structural subset, companion parity. */
.azb-md { font-size: 14px; line-height: 1.65; color: var(--ink); min-width: 0; }
.azb-md .md-p { margin: 0 0 8px; overflow-wrap: anywhere; }
.azb-md .md-p:last-child { margin-bottom: 0; }
.azb-md .md-h { margin: 12px 0 6px; font-size: 13px; font-weight: 700; color: var(--ink); }
.azb-md h4.md-h { font-size: 13.5px; }
.azb-md h6.md-h { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.azb-md .md-list { margin: 0 0 8px; padding-left: 22px; display: grid; gap: 3px; }
.azb-md .md-list li { overflow-wrap: anywhere; }
.azb-md .md-code { font: 12px var(--azb-font-mono); background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 5px; padding: 1px 5px; overflow-wrap: anywhere; }
.azb-md .md-pre { font: 11.5px/1.55 var(--azb-font-mono); background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 9px; padding: 9px 12px; margin: 0 0 8px; overflow-x: auto; white-space: pre; }
.azb-md .md-link { font: inherit; font-weight: 600; color: var(--accent); background: transparent; border: none; border-bottom: 1px solid var(--accent); padding: 0; cursor: pointer; overflow-wrap: anywhere; }
.azb-md .md-link[disabled] { cursor: default; border-bottom-style: dotted; }
/* iMIS location links — @/$/~ paths and instance URLs, clickable wherever they render. */
.azb-loc { font: inherit; min-height: 0; color: var(--link); background: transparent; border: 0; border-bottom: 1px dotted var(--link); padding: 0; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.azb-loc:hover { color: var(--accent); border-bottom-style: solid; }
/* Sandboxed markup preview — a light page surface inside the studio, scripts never run.
   Stacked previews (form panes, package files, markup lists) keep their own rhythm. */
.azb-preview { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2); min-width: 0; margin: 0 0 12px; }
.azb-preview:last-child { margin-bottom: 0; }
.azb-preview .pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 11px; border-bottom: 1px solid var(--line-soft); }
.azb-preview .pv-label { font-family: 'AgentZ Sans', var(--font-ui); font-size: 11px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.azb-preview .pv-note { font-size: 10.5px; color: var(--faint); overflow-wrap: anywhere; }
.azb-preview .pv-act { margin-left: auto; font: 600 10.5px var(--font-ui); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 3px 9px; cursor: pointer; }
.azb-preview .pv-act:hover { color: var(--accent); }
.azb-preview iframe { display: block; width: 100%; border: 0; background: #ffffff; }
.azb-preview .pv-src { margin: 0; border-top: 1px solid var(--line-soft); }
.azb-preview .pv-src > summary { cursor: pointer; user-select: none; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); padding: 6px 11px; }
.azb-preview .pv-src pre { font: 11px/1.55 var(--azb-font-mono); margin: 0; padding: 9px 12px; max-height: 300px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
/* Rendered-page audit — verification checks + the captured screenshot, in the studio. */
.azb-audit-target { display: grid; gap: 2px; margin: 0 0 10px; min-width: 0; }
.azb-audit-target .at-title { font-size: 14px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.azb-audit-target .at-url { font: 11px var(--azb-font-mono); color: var(--muted); overflow-wrap: anywhere; }
.azb-shot { margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface-2); }
.azb-shot .sh-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 11px; border-bottom: 1px solid var(--line-soft); }
.azb-shot .sh-label { font-family: 'AgentZ Sans', var(--font-ui); font-size: 11px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.azb-shot .sh-note { font-size: 10.5px; color: var(--faint); overflow-wrap: anywhere; }
.azb-shot .sh-act { margin-left: auto; font: 600 10.5px var(--font-ui); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 3px 9px; cursor: pointer; }
.azb-shot .sh-act:hover { color: var(--accent); }
.azb-shot .sh-frame { max-height: 420px; overflow: auto; background: #ffffff; }
.azb-shot.expanded .sh-frame { max-height: none; }
.azb-shot img { display: block; width: 100%; height: auto; }
.azb-shot .sh-fallback { padding: 12px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
/* Design-system studio — swatches, specimens, shape/motion chips, exhibit previews. */
.azb-ds-sect { margin: 0 0 14px; min-width: 0; }
.azb-ds-sect:last-child { margin-bottom: 0; }
.azb-ds-title { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 7px; }
.azb-swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
.azb-swatch { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface-2); min-width: 0; }
.azb-swatch .sw-chip { height: 44px; display: flex; align-items: flex-end; padding: 5px 8px; font: 600 10px var(--azb-font-mono); }
.azb-swatch .sw-meta { padding: 5px 8px; display: grid; gap: 1px; }
.azb-swatch .sw-name { font-size: 10.5px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.azb-swatch .sw-value { font: 10px var(--azb-font-mono); color: var(--faint); overflow-wrap: anywhere; }
.azb-type-specimen { display: grid; gap: 7px; }
.azb-type-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; border: 1px solid var(--line-soft); border-radius: 9px; background: var(--surface-2); padding: 8px 12px; min-width: 0; }
.azb-type-row .tp-role { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); min-width: 64px; }
.azb-type-row .tp-family { font-size: 15px; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.azb-type-row .tp-meta { font: 10.5px var(--azb-font-mono); color: var(--faint); }
.azb-scale-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; border: 1px solid var(--line-soft); border-radius: 9px; background: var(--surface-2); padding: 8px 12px; }
.azb-scale-step { display: flex; align-items: baseline; gap: 6px; }
.azb-scale-step .sc-sample { font-weight: 700; color: var(--ink); line-height: 1; }
.azb-scale-step .sc-name { font: 10px var(--azb-font-mono); color: var(--faint); }
.azb-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.azb-shape-chip { display: grid; justify-items: center; gap: 4px; }
.azb-shape-chip .shp-box { width: 46px; height: 34px; background: var(--surface-2); border: 1.5px solid var(--accent); }
.azb-shape-chip .shp-name { font: 10px var(--azb-font-mono); color: var(--faint); }
.azb-token-chip { border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface-2); padding: 5px 10px; display: grid; gap: 1px; }
.azb-token-chip .tk-name { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
.azb-token-chip .tk-value { font: 11px var(--azb-font-mono); color: var(--ink-2); overflow-wrap: anywhere; }
.azb-elev-chip { width: 92px; height: 52px; border-radius: 10px; background: var(--surface); display: flex; align-items: center; justify-content: center; font: 10px var(--azb-font-mono); color: var(--faint); }
.azb-palette-strip { display: flex; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); height: 34px; }
.azb-palette-strip span { flex: 1; }
.azb-exhibit { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); margin: 0 0 8px; overflow: hidden; min-width: 0; }
.azb-exhibit .ex-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 11px; }
.azb-exhibit .ex-title { font-size: 12px; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.azb-exhibit .ex-section { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
.azb-exhibit .ex-act { margin-left: auto; font: 600 10.5px var(--font-ui); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; cursor: pointer; }
.azb-exhibit .ex-act:hover, .azb-exhibit .ex-act.open { color: var(--accent); border-color: var(--accent); }
.azb-recipe { border: 1px solid var(--line-soft); border-radius: 9px; background: var(--surface-2); padding: 8px 11px; margin: 0 0 7px; min-width: 0; }
.azb-recipe .rc-name { font-size: 12px; font-weight: 700; color: var(--ink); }
.azb-recipe .rc-class { font: 10.5px var(--azb-font-mono); color: var(--accent); overflow-wrap: anywhere; }
.azb-recipe .rc-anatomy { font: 11px/1.5 var(--azb-font-mono); color: var(--ink-2); margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
:root[data-display-mode="fullscreen"] .azb-shot .sh-frame { max-height: 62vh; }
:root[data-display-mode="fullscreen"] .azb-head,
:root[data-display-mode="fullscreen"] .azb-panel { padding-left: 28px; padding-right: 28px; }
:root[data-display-mode="fullscreen"] .azb-table-scroll { overflow-x: auto; margin-left: -28px; margin-right: -28px; padding-left: 28px; padding-right: 28px; }
:root[data-display-mode="fullscreen"] table.azb-table { table-layout: auto; min-width: 640px; }
:root[data-display-mode="fullscreen"] table.azb-table td { white-space: nowrap; }
:root[data-display-mode="fullscreen"] .azb-raw { max-height: 52vh; }
</style>
